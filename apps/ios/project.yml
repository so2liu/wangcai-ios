name: WorthSnap
options:
  bundleIdPrefix: com.yueyu
  deploymentTarget:
    iOS: "17.0"
packages:
  WorthSnapShared:
    path: ../../packages/shared
targets:
  WorthSnap:
    type: application
    platform: iOS
    sources:
      - WorthSnap
    dependencies:
      - package: WorthSnapShared
    entitlements:
      path: WorthSnap/WorthSnap.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.yueyu.WorthSnap
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yueyu.WorthSnap
        DEVELOPMENT_TEAM: 366ADQ28F6
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 旺财
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # CloudKit 共享需后台远程通知，用于接收 zone 变更推送。
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
